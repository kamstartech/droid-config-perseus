# TRD-007: tell connman to ignore rndis0 so it does not manage/clobber the static IP
# that usb-rndis-up.service assigns (192.168.2.15). Without this, connman takes over
# rndis0 (it is not in connman's default blacklist) and SSH/L3 over USB breaks.
#
# This replaces the earlier /etc/connman/main.conf NetworkInterfaceBlacklist approach,
# which conflicted with the connman-configs-sailfish RPM (both own /etc/connman/main.conf)
# and aborted the MIC image build. connman.service sources /var/lib/environment/connman/*.conf
# and appends $CONNMAN_ARGS to connmand; -I/--nodevice tells connman to ignore the interface.
# -I wlan1: SDM845 creates wlan0 + wlan1; connman managing both produces duplicate scan
# entries per network which breaks the WLAN settings UI. Only wlan0 is the STA interface.
CONNMAN_ARGS=-I rndis0 -I wlan1
