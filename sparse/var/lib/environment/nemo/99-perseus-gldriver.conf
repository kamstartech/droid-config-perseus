# Perseus (Mi Mix 3): force Zink for app rendering, matching the compositor
# (see compositor/droid-hal-device.conf — MESA_LOADER_DRIVER_OVERRIDE=zink).
#
# On SDM845 /dev/dri/card0 is the SDE display controller — display/KMS only, no GPU
# rendering. The Adreno 630 GPU is reachable only via KGSL (/dev/kgsl-3d0), so the
# native freedreno GL driver (msm) has no DRM render node and falls back to software
# (llvmpipe). Zink (OpenGL -> Vulkan -> Turnip/KGSL) is the only hardware GL path.
#
# Apps MUST use the SAME driver as lipstick: the compositor imports each client's
# GBM/dma-buf surface, and if the buffer modifiers don't match (zink compositor vs a
# freedreno/software client) the import fails and the app window composites BLACK.
# That is the black-screen / cannot-navigate symptom (TRD-022).
#
# This file loads after 50-jolla-ui.conf (RPM-owned), whose EGL_DRIVER=egl_gallium is
# a dead pre-2013 Mesa setting (no such driver in Mesa 25.1.4) and is ignored.
MESA_LOADER_DRIVER_OVERRIDE=zink
