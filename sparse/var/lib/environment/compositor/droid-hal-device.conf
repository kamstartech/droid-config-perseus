# Perseus (Mi Mix 3) — libhybris HWComposer rendering (Adreno 630)
# Stack: Qt hwcomposer → libhybris EGL → HWComposer HAL → Adreno GPU → display
QT_QPA_PLATFORM=hwcomposer
EGL_PLATFORM=hwcomposer
QT_DEVICE_PIXEL_RATIO=1.5
LIPSTICK_OPTIONS=-plugin evdevtouch -plugin evdevkeyboard
# Skip hw_get_module() passthrough — connect to the already-running binderized HIDL service.
# Without this, Qt loads hwcomposer.qcom.so directly if the HIDL service isn't up yet,
# creating a second HWCSession that fights the service for DRM master (BAD_DISPLAY error).
QT_QPA_FORCE_HWC2=1
