# Strip setgid from lipstick and startup wizard so Mesa's __normal_user() returns
# true, enabling MESA_LOADER_DRIVER_OVERRIDE and all other Mesa/Vulkan env overrides.
# Both binaries ship setgid=privileged (gid 996) for MDM; /dev/kgsl-3d0 and
# /dev/dri/card0 are world-accessible so nemo doesn't need that gid for GPU access.
# 'm' adjusts mode of an existing file (does not create). Runs as root during
# systemd-tmpfiles-setup.service before user sessions start.
m /usr/bin/lipstick 0755
m /usr/bin/jolla-startupwizard-pre-user-session 0755
