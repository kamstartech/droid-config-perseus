# Perseus / Xiaomi Mi Mix 3: ensure qpnp-haptics vibrator LED sysfs nodes are
# world-writable before NGFD's droid-vibrator plugin opens them.
# The 'z' line adjusts permissions of an existing file/directory.
z /sys/class/leds/vibrator/activate  0666 root root - -
z /sys/class/leds/vibrator/duration  0666 root root - -
z /sys/class/leds/vibrator/state     0666 root root - -
z /sys/class/leds/vibrator/brightness 0666 root root - -
