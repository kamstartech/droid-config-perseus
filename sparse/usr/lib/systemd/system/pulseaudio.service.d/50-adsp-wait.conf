[Unit]
After=droid-hal-init.service

[Service]
# SDM845 ADSP APR comes up at t~103s. Loading module-droid-card before APR
# fills Q6ASM slots with 5s-timeout zombies (ADSP_ENEEDMORE). Block PA startup
# until t=120s so droid.pa can load the modules from config as upstream intends.
ExecStartPre=/usr/bin/droid/adsp-apr-wait.sh
TimeoutStartSec=150
