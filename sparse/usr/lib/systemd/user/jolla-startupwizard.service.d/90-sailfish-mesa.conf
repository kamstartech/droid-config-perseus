[Unit]
# The original Requires=booster-silica-qt5.service causes cascade failure when
# the booster has a transient PID-file race on first boot (Type=forking race
# with compositor not yet ready). A dependency failure cancels this unit before
# it runs, and Restart=on-failure does not cover cancellation-by-dependency.
# Replace hard Requires with Wants so the wizard can start independently;
# the booster recovers via its own Restart=always within a few seconds.
Requires=
Requires=dbus.socket lipstick.service user-session.target
Wants=booster-silica-qt5.service

[Service]
# Allow more retries and longer gaps so the booster has time to recover
# before the wizard attempts to connect to it.
StartLimitBurst=8
RestartSec=3
