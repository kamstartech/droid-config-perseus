[Service]
# Without -n the invoker waits forever for the media booster to send an exit
# status; the media preload path never completes that handshake. See
# docs/references/DIAGNOSIS-boot-hang-2026-07-05.md.
Type=oneshot
RemainAfterExit=yes
PIDFile=
Restart=no
ExecStart=
ExecStart=/usr/bin/invoker -n --type=silica-session -o /usr/libexec/mapplauncherd/booster-silica-media --daemon
