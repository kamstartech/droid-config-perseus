[Service]
# mapplauncherd never writes the PID file expected by Type=forking — boosters
# live under the booster-silica-session master daemon (not tracked by systemd).
# Type=oneshot + RemainAfterExit lets the invoker trigger the pre-fork and exit
# cleanly (it already exits 0), so systemd considers the service satisfied and
# downstream dependencies (lipstick-security-ui) are unblocked.
Type=oneshot
RemainAfterExit=yes
PIDFile=
Restart=no
