[Service]
# Type=forking with PIDFile has an unfixable race: invoker exits before the
# daemon child writes its PID, or the child exits before systemd reads the file.
# Change to oneshot+RemainAfterExit so systemd considers the service active as
# soon as invoker returns — no PID file, no daemon tracking, no race.
Type=oneshot
RemainAfterExit=yes
PIDFile=
# Type=oneshot disallows Restart= values other than no — clear it.
Restart=no
# Wait up to 60s for the Wayland compositor socket before launching the booster.
# lipstick.service becoming "active" only means the process started (Type=simple);
# the EGL/KMS compositor and wayland-0 socket are created well after that.
ExecStartPre=
ExecStartPre=/bin/sh -c 'for i in $(seq 120); do [ -S /run/user/100000/wayland-0 ] && exit 0; sleep 0.5; done; exit 0'
