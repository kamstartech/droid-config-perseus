[Service]
# Clear any hwcomposer-era ExecStartPre entries (dummy_compositor not needed with Mesa/KMS).
# MCE controls panel power directly via DRM DPMS (/sys/class/drm/card0-DSI-1/dpms).
# setgid removal is handled by tmpfiles.d/lipstick-nosetgid.conf at system boot.
ExecStartPre=
# Turnip (KGSL) creates one fence fd per GPU submission. At 60fps with triple-buffering
# the default 1024 soft limit is exhausted within seconds, causing kgsl_add_fence_event
# to return EMFILE and apps to fail connecting to the Wayland compositor.
LimitNOFILE=65536
