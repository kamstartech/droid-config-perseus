[Service]
# Clear any hwcomposer-era ExecStartPre entries (dummy_compositor not needed with Mesa/KMS).
# MCE controls panel power directly via DRM DPMS (/sys/class/drm/card0-DSI-1/dpms).
ExecStartPre=
# Mesa's __normal_user() (src/util/u_debug.h) returns false when getegid()!=getgid(),
# blocking ALL env overrides (MESA_LOADER_DRIVER_OVERRIDE, VK_LOADER_DEBUG, MESA_DEBUG…).
# lipstick ships setgid=privileged(gid 996) for MDM; /dev/kgsl-3d0 and /dev/dri/card0
# are world-accessible so nemo doesn't need that gid for GPU rendering.
# The '+' prefix executes this as root before lipstick starts, within the SailfishOS namespace.
ExecStartPre=+/bin/chmod g-s /usr/bin/lipstick
