[general]
plugins = dbus;transform;resource;profile;streamrestore;tonegen;mce;canberra;gst;callstate;route;droid-vibrator;null
# ffmemless removed: perseus has no input force-feedback haptics device;
# leaving it enabled makes it register as a haptic sink and silence gestures.
plugins-optional = devicelock
sink-order = gst

[droid-vibrator]
native.path = /sys/class/leds/vibrator/duration
native.activate_path = /sys/class/leds/vibrator/activate

[keytypes]
core.max_timeout = INTEGER
