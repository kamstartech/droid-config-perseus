# Mi Mix 3 (SDM845) dual-SIM config.
# The [slot2] group name must match the hwservicemanager service name
# (IRadio/slot2 on qcrild). The path key is the D-Bus modem object path
# and must start with / — here we follow the conventional /ril_N naming.
# radioInterface = 1.4 matches what SDM845 qcrild actually exports.

[Settings]
ExpectSlots+=slot2

[slot2]
path = /ril_1
slot = 1
radioInterface = 1.4
