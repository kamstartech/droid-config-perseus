[Unit]
After=droid-hal-init.service

[Service]
# config.mount runs early but usb_gadget registers after DWC3 peripheral-mode
# init completes. Poll until it appears, then build the full configfs gadget
# structure that Android's init.qcom.usb.rc would normally set up.
# usb-moded rescue mode (-r) activates developer_mode without cable detection,
# which is required for switch_root cold-boot where Android init never runs.
ExecStartPre=/bin/sh -c '\
  i=0; \
  while [ ! -d /config/usb_gadget ] && [ $i -lt 30 ]; do \
    sleep 1; i=$((i+1)); \
  done; \
  [ -d /config/usb_gadget ] || { echo "USB_SETUP: usb_gadget timeout"; exit 1; }; \
  echo "USB_SETUP: usb_gadget appeared after ${i}s"; \
  G=/config/usb_gadget/g1; \
  mkdir -p $G/strings/0x409 && echo "USB_SETUP: g1 created"; \
  printf "0x05C6" > $G/idVendor; \
  printf "0xF00E" > $G/idProduct; \
  printf "0x0200" > $G/bcdUSB; \
  printf "Xiaomi" > $G/strings/0x409/manufacturer; \
  printf "Mi Mix 3" > $G/strings/0x409/product; \
  printf "perseus" > $G/strings/0x409/serialnumber; \
  mkdir -p $G/configs/b.1/strings/0x409; \
  printf "900" > $G/configs/b.1/MaxPower; \
  printf "rndis" > $G/configs/b.1/strings/0x409/configuration; \
  mkdir -p $G/functions/gsi.rndis && echo "USB_SETUP: gsi.rndis function created"; \
  echo "USB_SETUP: g1 structure: $(ls $G/ 2>&1)"; \
  echo "USB_SETUP: functions: $(ls $G/functions/ 2>&1)"'
