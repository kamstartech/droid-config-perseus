# TRD-007: neuter usb-moded's daemon so it cannot re-grab the USB gadget on cable
# events. usb-moded picks charging mode on cable connect and tries the wrong
# configfs function (rndis_bam.rndis vs the SDM845 gsi.rndis), clobbering the RNDIS
# gadget set up by usb-rndis-up.service. Clearing ExecStart (empty line resets the
# inherited value, second line replaces it) makes the unit a no-op; the gadget
# structure builder in 10-usb-configfs.conf (ExecStartPre) still runs and is not
# cleared. Type=oneshot so the immediate /bin/true exit is not treated as a failure
# (the packaged unit is Type=notify). Net: usb-rndis-up.service owns the gadget.
# Tradeoff: USB is RNDIS-always — no charging/MTP mode-switch UI (acceptable: dev ROM).
[Service]
ExecStart=
ExecStart=/bin/true
Type=oneshot
Restart=no
