[Unit]
After=droid-hal.service
Wants=droid-hal.service
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
RestartSec=5
# TRD-011: sensorfwd starts ~4s before droid-hal-init brings up the Android sensors
# HAL (android.hardware.sensors@1.0-service, class hal), so it loads zero plugins and
# never retries. After=droid-hal.service is satisfied too early (droid-hal sends sd_notify
# READY before the HALs are up). Wait for the sensors HAL process (+2s to let it register
# ISensors with hwservicemanager) before starting sensorfwd. Caps at 30s, never blocks boot.
# NOTE: the pattern is bracketed ([a]ndroid…) so pgrep does not match its OWN command line
# (which literally contains the search string). Without the bracket trick the wait returns
# instantly (boot 00:27 bug: sensorfwd started 2s BEFORE the HAL and loaded no plugins).
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 30 ] && ! /usr/bin/pgrep -f "[a]ndroid.hardware.sensors" >/dev/null 2>&1; do sleep 1; i=$((i+1)); done; sleep 2; exit 0'
