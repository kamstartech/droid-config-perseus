[Manager]
# Android 15 libhybris: bootstrap bionic must be found before
# /system/lib64 (which has broken APEX symlinks)
DefaultEnvironment=HYBRIS_LD_LIBRARY_PATH=/system/lib64/bootstrap:/usr/libexec/droid-hybris/system/lib64:/system/lib64:/vendor/lib64:/system/lib64/vndk-sp:/apex/com.android.runtime/lib64 HYBRIS_LD_DEBUG=1
