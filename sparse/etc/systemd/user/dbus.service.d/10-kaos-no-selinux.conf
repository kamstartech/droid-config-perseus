[Service]
# Ubuntu's dbus-daemon is built with SELinux support (unlike SailfishOS's
# own dbus, which has none). is_selinux_enabled() only checks whether
# SELinux is compiled into the kernel and /sys/fs/selinux is mounted and
# functional -- it does NOT care whether the kernel is enforcing or
# permissive (that only affects whether a denial blocks vs. just logs).
# This kernel is actually permissive by default on this ROM (a patched
# system/core/init/selinux.cpp forces it there on every real Android boot --
# see CLAUDE.md's SELinux section, corrected 2026-09-24), but SELinux is
# still genuinely compiled in and active. Once /sys/fs/selinux is mounted
# (kaos-droid-hal-prepare.sh does this for droid-hal-init's own genuine
# needs), the user session's dbus-daemon sees is_selinux_enabled()==true,
# activates its SELinux code path, and fails immediately looking for
# /etc/selinux/targeted/contexts/dbus_contexts, a policy file this plain
# Ubuntu rootfs doesn't have (and providing a stub file wouldn't really fix
# it either -- dbus-daemon would then also MAC-check every message against
# the kernel's real loaded policy, which is Android's own sepolicy and has
# no notion of Ubuntu's dbus object classes/contexts at all).
# Confirmed live 2026-09-24: this made `systemd --user`'s own dbus.service
# exit 1 every attempt, so no user session bus ever came up, which is why
# gnome-session-binary (spawned by phosh-session) got "Could not connect:
# Connection refused" and phosh crash-looped.
# Harmless on any build whose dbus-daemon has no SELinux support at all
# (e.g. SailfishOS's own) -- that binary never calls is_selinux_enabled(),
# so the preload has nothing to intercept. See
# kaos/scripts/kaos-selinux-disable.c for the shim itself and why a stub
# dbus_contexts file alone wouldn't be a real fix.
Environment=LD_PRELOAD=/usr/local/lib/kaos-selinux-disable.so
