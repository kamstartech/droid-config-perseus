[Service]
# Wait for the ADSP CPE (Codec Processor Engine) APR channel to be ready before
# starting PulseAudio. On perseus/SDM845 droid-card is loaded at PA startup, and
# module-droid-card needs a live ADSP APR channel to open its output streams.
# Without this gate, OHM routing decisions race the card creation and streams
# fall back to sink.null.
#
# CPE ONLINE typically follows vendor.adsprpcd opening /dev/adsprpc-smd by a few
# seconds (observed ~50.5s to ~58s boot time on warm boots). Poll the state file
# with a generous timeout so cold boots still work.
ExecStartPre=/usr/bin/droid/adsp-wait-for-cpe.sh
