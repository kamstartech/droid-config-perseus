# Perseus (Xiaomi Mi Mix 3) hall-effect slider handling for MCE.
# The "halls" input device reports:
#   slide-open  -> KEYCODE_0x253
#   slide-close -> KEYCODE_0x252
# Map open to KEY_CAMERA so MCE launches jolla-camera.
# Map close to KEY_RESERVED so it is explicitly ignored for now.
# See: docs/references/INSPECTION-BRIEF-camera-slider-aibutton.md

# MCE must track the device; with only two keys it would otherwise be ignored.
[EVDEV_TYPE]
halls=INPUT

[EVDEV]
KEYCODE_0x253=KEY_CAMERA
KEYCODE_0x252=KEY_RESERVED
