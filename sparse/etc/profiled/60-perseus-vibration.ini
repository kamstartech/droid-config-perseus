# Perseus / Xiaomi Mi Mix 3: default touch feedback settings.
# Ensure touch sounds and vibration are enabled by default in the standard
# profiles. NGFD checks these context keys for gesture feedback.
[general]
touchscreen.sound.level = 1
touchscreen.vibration.level = 1
vibrating.alert.enabled = On

[ambience]
touchscreen.sound.level = 1
touchscreen.vibration.level = 1
vibrating.alert.enabled = On
