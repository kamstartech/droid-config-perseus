# Perseus (SDM845) usb-moded configfs backend configuration.
#
# This replaces the TRD-007 force-RNDIS stack (neutered usb-moded + usb-rndis-up.sh
# unconditional UDC bind). The original failure that justified TRD-007 — usb-moded
# activating rndis_bam.rndis instead of the SDM845 gsi.rndis function — is just
# usb-moded's compiled-in default for function_rndis; overriding it here lets the
# daemon own the gadget again. With usb-moded in charge the UDC is only bound while
# a cable is present, so the USB PHY can power-collapse when unplugged (the
# always-bound gadget was draining the battery).
#
# Cable detection: usb-moded's udev defaults already match SDM845
# (path=/sys/class/power_supply/usb, subsystem=power_supply, extcon tracking on),
# so no [udev] section is needed unless testing shows detection failures.
#
# usb-rndis-up.sh remains installed as a cable-gated fallback: if a cable is
# present but usb-moded has not enumerated RNDIS within its timeout, it forces
# the gadget so SSH access is never lost.

[configfs]
gadget_base_directory = /config/usb_gadget/g1
gadget_conf_directory = configs/b.1
function_rndis        = gsi.rndis
function_mtp          = ffs.mtp

[android]
# configfs rejects bare hex ("write failure: Invalid argument") — 0x prefix required
idVendor      = 0x05C6
idProduct     = 0xF00E
iManufacturer = Xiaomi
iProduct      = Mi Mix 3
